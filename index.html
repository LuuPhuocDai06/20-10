    <svg style="display: none;" id="theSvg" viewBox="-120 -30 240 180" enable-background="new 0 0 174 148"

    <script>
        let rid = null; // request animation id
        const SVG_NS = "http://www.w3.org/2000/svg";
        const pathlength = shape.getTotalLength();

        let t = 0; // at the begining of the path
        let lengthAtT = pathlength * t;

        let d = shape.getAttribute("d");

        // 1. build the d array
        let n = d.match(/C/gi).length; // how many times

        let pos = 0; // the position, used to find the indexOf the nth C

        class subPath {
            constructor(d) {
                this.d = d;
                this.get_PointsRy();
                this.previous = subpaths.length > 0 ? subpaths[subpaths.length - 1] : null;
                this.measurePath();
                this.get_M_Point(); //lastPoint
                this.lastCubicBezier;
                this.get_lastCubicBezier();
            }

            get_PointsRy() {
                this.pointsRy = [];
                let temp = this.d.split(/[A-Z,a-z\s,]/).filter(v => v); // remove empty elements
                temp.map(item => {
                    this.pointsRy.push(parseFloat(item));
                }); //this.pointsRy numbers not strings
            }

            measurePath() {
                let path = document.createElementNS(SVG_NS, "path");
                path.setAttributeNS(null, "d", this.d);
                // no need to append it to the SVG
                // the lengths of every path in dry
                this.pathLength = path.getTotalLength();
            }

            get_M_Point() {
                if (this.previous) {
                    let p = this.previous.pointsRy;
                    let l = p.length;
                    this.M_point = [p[l - 2], p[l - 1]];
                } else {
                    let p = this.pointsRy;
                    this.M_point = [p[0], p[1]];
                }
            }

            get_lastCubicBezier() {
                let lastIndexOfC = this.d.lastIndexOf("C");
                let temp = this.d
                    .substring(lastIndexOfC + 1)
                    .split(/[\s,]/)
                    .filter(v => v);
                let _temp = [];
                temp.map(item => {
                    _temp.push(parseFloat(item));
                });
                this.lastCubicBezier = [this.M_point];
                for (let i = 0; i < _temp.length; i += 2) {
                    this.lastCubicBezier.push(_temp.slice(i, i + 2));
                }
            }
        }

        let subpaths = [];

        // create new subPaths
        for (let i = 0; i < n; i++) {
            // finds the of nth C in d
            let newpos = d.indexOf("C", pos + 1);
            if (i > 0) {
                // if it's not the first C
                let sPath = new subPath(d.substring(0, newpos));
                subpaths.push(sPath);
            }
            //change the value of the position pos
            pos = newpos;
        }
        // at the end add d to the subpaths array
        subpaths.push(new subPath(d));

        // 2. get the index of the bezierLengths where the point at t is
        let index;
        for (index = 0; index < subpaths.length; index++) {
            if (subpaths[index].pathLength >= lengthAtT) {
                break;
            }
        }

        function get_T(t, index) {
            let T;
            lengthAtT = pathlength * t;
            if (index > 0) {
                T =
                    (lengthAtT - subpaths[index].previous.pathLength) /
                    (subpaths[index].pathLength - subpaths[index].previous.pathLength);
            } else {
                T = lengthAtT / subpaths[index].pathLength;
            }
            //console.log(T)
            return T;
        }

        let T = get_T(t, index);

        let newPoints = getBezierPoints(T, subpaths[index].lastCubicBezier);

        drawCBezier(newPoints, partialPath, index);

        function getBezierPoints(t, points) {
            let helperPoints = [];

            // helper points 0,1,2
            for (let i = 1; i < 4; i++) {
                //points.length must be 4 !!!
                let p = lerp(points[i - 1], points[i], t);
                helperPoints.push(p);
            }

            // helper points 3,4
            helperPoints.push(lerp(helperPoints[0], helperPoints[1], t));
            helperPoints.push(lerp(helperPoints[1], helperPoints[2], t));

            // helper point 5 is where the first Bézier ends and where the second Bézier begins
            helperPoints.push(lerp(helperPoints[3], helperPoints[4], t));

            // points for the dynamic bézier
            let firstBezier = [
                points[0],
                helperPoints[0],
                helperPoints[3],
                helperPoints[5]
            ];
            //console.log(firstBezier)
            return firstBezier;
        }

        function lerp(A, B, t) {
            let ry = [
                (B[0] - A[0]) * t + A[0], //x
                (B[1] - A[1]) * t + A[1] //y
            ];
            return ry;
        }

        function drawCBezier(points, path, index) {
            let d;

            if (index > 0) {
                d = subpaths[index].previous.d;
            } else {
                d = `M${points[0][0]},${points[0][1]} C`;
            }

            // points.length == 4
            for (let i = 1; i < 4; i++) {
                d += ` ${points[i][0]},${points[i][1]} `;
            }
            //console.log(d)
            partialPath.setAttributeNS(null, "d", d);
        }
    </script>

      hx[n]=ox*k+(rnd()-.5)*.3;hy[n]=oy*k+(rnd()-.5)*.3;hz[n]=z;hs[n]=rnd();hp[n]=rnd()*TAU;

/* ---------- Flower sprites: nhiều loại hoa ---------- */
const S=320;
function mk(draw){const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');g.translate(S/2,S/2);draw(g);return c}
function fillGrad(g,len,c1,c2){const gr=g.createRadialGradient(0,-len*.08,len*.04,0,-len*.55,len*.75);gr.addColorStop(0,c1);gr.addColorStop(1,c2);return gr}
function finish(g,len,edge){g.strokeStyle=edge||'rgba(120,20,60,.3)';g.lineWidth=1.5;g.stroke();g.beginPath();g.moveTo(0,-len*.15);g.lineTo(0,-len*.75);g.strokeStyle='rgba(255,255,255,.25)';g.stroke()}
/* cánh bầu (hoa nhiều lớp / hoa nhỏ 5 cánh) */
function petal(g,len,w,c1,c2,edge){
  g.beginPath();g.moveTo(0,0);g.bezierCurveTo(-w,-len*.3,-w*.8,-len*.95,0,-len);g.bezierCurveTo(w*.8,-len*.95,w,-len*.3,0,0);
  g.fillStyle=fillGrad(g,len,c1,c2);g.fill();finish(g,len,edge);
}
/* cánh nhọn (sen, hướng dương, cúc) */
function pointed(g,len,w,c1,c2,edge){
  g.beginPath();g.moveTo(0,0);g.quadraticCurveTo(-w,-len*.55,0,-len);g.quadraticCurveTo(w,-len*.55,0,0);
  g.fillStyle=fillGrad(g,len,c1,c2);g.fill();finish(g,len,edge);
}
/* cánh xẻ khía (anh đào) */
function notched(g,len,w,c1,c2,edge){
  g.beginPath();g.moveTo(0,0);g.bezierCurveTo(-w*1.1,-len*.25,-w,-len*.95,-w*.2,-len);g.lineTo(0,-len*.88);g.lineTo(w*.2,-len);g.bezierCurveTo(w,-len*.95,w*1.1,-len*.25,0,0);
  g.fillStyle=fillGrad(g,len,c1,c2);g.fill();finish(g,len,edge);
}
function ring(g,n,off,fn){for(let i=0;i<n;i++){g.save();g.rotate((i+off)*TAU/n);fn();g.restore()}}
function disc(g,r,c1,c2){const cg=g.createRadialGradient(0,0,1,0,0,r);cg.addColorStop(0,c1);cg.addColorStop(1,c2);g.fillStyle=cg;g.beginPath();g.arc(0,0,r,0,TAU);g.fill()}
function dots(g,n,R,r,col){g.fillStyle=col;for(let i=0;i<n;i++){const a=i*TAU/n;g.beginPath();g.arc(Math.cos(a)*R,Math.sin(a)*R,r,0,TAU);g.fill()}}

/* 1. Hoa nhiều lớp (kiểu cũ) */
function layered(c1,c2){return mk(g=>{
  g.shadowColor='rgba(90,0,50,.45)';g.shadowBlur=10;
  ring(g,7,0,()=>petal(g,150,58,c1,c2));
  g.shadowBlur=6;ring(g,7,.5,()=>petal(g,100,40,c1,c2));
  g.shadowBlur=0;disc(g,24,'#fff3b0','#f2a93b');dots(g,9,13,2.2,'#c9731a');
})}
/* 2. Hoa cúc */
function daisy(c1,c2,mid){return mk(g=>{
  g.shadowColor='rgba(60,0,40,.35)';g.shadowBlur=8;
  ring(g,18,0,()=>pointed(g,152,26,c1,c2,'rgba(90,60,70,.25)'));
  ring(g,18,.5,()=>pointed(g,128,24,c1,c2,'rgba(90,60,70,.25)'));
  g.shadowBlur=0;disc(g,30,'#fff2a0',mid);dots(g,12,17,2,'rgba(140,80,0,.55)');
})}
/* 3. Hoa anh đào */
function sakura(c1,c2){return mk(g=>{
  g.shadowColor='rgba(90,0,50,.4)';g.shadowBlur=10;
  ring(g,5,0,()=>notched(g,150,62,c1,c2));
  g.shadowBlur=0;disc(g,16,'#ffd0dc','#e0457b');
  g.strokeStyle='#c2185b';g.lineWidth=2;
  for(let i=0;i<10;i++){const a=i*TAU/10;g.beginPath();g.moveTo(0,0);g.lineTo(Math.cos(a)*38,Math.sin(a)*38);g.stroke();g.fillStyle='#ffe082';g.beginPath();g.arc(Math.cos(a)*38,Math.sin(a)*38,3.2,0,TAU);g.fill()}
})}
/* 4. Hoa sen */
function lotus(c1,c2){return mk(g=>{
  g.shadowColor='rgba(90,0,50,.4)';g.shadowBlur=10;
  ring(g,8,0,()=>pointed(g,152,48,c1,c2));
  g.shadowBlur=6;ring(g,8,.5,()=>pointed(g,122,44,c1,c2));
  ring(g,6,0,()=>pointed(g,88,36,c1,c2));
  g.shadowBlur=0;disc(g,22,'#fff59d','#f9a825');dots(g,8,12,2,'#e65100');
})}
/* 5. Hướng dương */
function sunflower(){return mk(g=>{
  g.shadowColor='rgba(80,40,0,.4)';g.shadowBlur=8;
  ring(g,22,0,()=>pointed(g,152,30,'#ffd400','#ff9f00','rgba(120,60,0,.3)'));
  ring(g,22,.5,()=>pointed(g,130,28,'#ffe34d','#ffb300','rgba(120,60,0,.3)'));
  g.shadowBlur=0;disc(g,56,'#6d4c41','#3e2723');
  g.fillStyle='rgba(255,193,7,.55)';
  for(let i=0;i<110;i++){const r=Math.sqrt(i/110)*50,a=i*2.399963;g.beginPath();g.arc(Math.cos(a)*r,Math.sin(a)*r,2,0,TAU);g.fill()}
})}
/* 6. Hoa nhỏ 5 cánh (lưu ly / tím) */
function small5(c1,c2,mid){return mk(g=>{
  g.shadowColor='rgba(30,10,80,.4)';g.shadowBlur=8;
  ring(g,5,0,()=>petal(g,118,62,c1,c2,'rgba(40,30,110,.3)'));
  g.shadowBlur=0;disc(g,22,'#ffffff',mid);dots(g,6,10,2,'#f9a825');
})}
/* 7. Hoa anh túc / thược dược 4–8 cánh bản rộng */
function poppy(c1,c2,n){return mk(g=>{
  g.shadowColor='rgba(80,0,0,.45)';g.shadowBlur=10;
  ring(g,n,0,()=>petal(g,148,n>5?52:84,c1,c2,'rgba(110,0,0,.3)'));
  g.shadowBlur=0;disc(g,18,'#4e342e','#1b1b1b');
  g.strokeStyle='#212121';g.lineWidth=1.6;
  for(let i=0;i<16;i++){const a=i*TAU/16;g.beginPath();g.moveTo(Math.cos(a)*14,Math.sin(a)*14);g.lineTo(Math.cos(a)*34,Math.sin(a)*34);g.stroke();g.fillStyle='#3e2723';g.beginPath();g.arc(Math.cos(a)*34,Math.sin(a)*34,2.6,0,TAU);g.fill()}
})}

const PAL=[['#e83e84','#ffb3cf'],['#ff7aa8','#ffe3ee'],['#c72a70','#ff8fbd'],['#ff9bb5','#fff0f5'],['#ff6f7d','#ffd3c7'],['#d94a9a','#ffc4e6']];
const SPR=[
  ...PAL.map(p=>layered(p[0],p[1])),                       // hoa nhiều lớp (hồng)
  daisy('#ffffff','#ffe3ee','#f2a93b'),                    // cúc trắng
  daisy('#ff9bb5','#fff0f5','#f2a93b'),                    // cúc hồng
  daisy('#ffe066','#fff7c2','#e68a00'),                    // cúc vàng
  sakura('#ffb7d0','#fff2f7'),sakura('#ff8fb8','#ffe0ec'), // anh đào
  lotus('#ff7aa8','#fff0f5'),lotus('#ff4f93','#ffc6dc'),   // sen
  sunflower(),                                             // hướng dương
  small5('#7b8cff','#e3e7ff','#ffd54f'),                   // lưu ly xanh
  small5('#b07cff','#efe0ff','#ffd54f'),                   // hoa tím
  poppy('#e53935','#ff9e80',4),                            // anh túc đỏ
  poppy('#ff7043','#ffd0b8',8),                            // thược dược cam
  poppy('#ff5c8a','#ffd1e0',6)                             // cosmos hồng đậm
];

/* ---------- Ảnh hoa tự thêm (PNG nền trong suốt) ----------
   Bỏ ảnh vào thư mục "flowers" cạnh index.html rồi ghi tên file vào đây.
   ONLY_IMAGES = true  -> chỉ dùng ảnh của bạn
   ONLY_IMAGES = false -> trộn ảnh của bạn với hoa vẽ bằng code */
const IMAGE_FILES=[
  'flowers/hong-trang-1.png','flowers/hong-trang-2.png',
  'flowers/hong-do-1.png','flowers/hong-do-2.png',
  'flowers/cam-tu-cau-xanh.png','flowers/cam-tu-cau-hong.png',
  'flowers/ly-1.png','flowers/ly-2.png'
];
const ONLY_IMAGES=true;
let POOL=SPR.slice();const LOADED=[];
IMAGE_FILES.forEach(src=>{
  const im=new Image();
  im.onload=()=>{
    const IS=512,c=document.createElement('canvas');c.width=c.height=IS;const g=c.getContext('2d');
    const k=Math.min(IS/im.width,IS/im.height);const w=im.width*k,h=im.height*k;
    g.drawImage(im,(IS-w)/2,(IS-h)/2,w,h);
    LOADED.push(c);POOL=ONLY_IMAGES?LOADED.slice():SPR.concat(LOADED);
  };
  im.onerror=()=>console.warn('Không tải được ảnh hoa:',src);
  im.src=src;
});

/* ---------- Flower field (Fibonacci sphere around the viewer, so rotation never leaves gaps) ---------- */
const NF=W<700?1900:2000,fx=new Float32Array(NF),fy=new Float32Array(NF),fz=new Float32Array(NF),fs=new Float32Array(NF),fd=new Float32Array(NF),fr=new Float32Array(NF),fw=new Float32Array(NF),fp=new Uint8Array(NF),Z=new Float32Array(NF),SX=new Float32Array(NF),SY=new Float32Array(NF),SZ=new Float32Array(NF);
for(let i=0;i<NF;i++){
  const y=1-2*(i+.5)/NF,r=Math.sqrt(1-y*y),th=i*2.399963+rnd()*.15,dist=380+rnd()*900;
  fx[i]=r*Math.cos(th)*dist;fy[i]=y*dist;fz[i]=r*Math.sin(th)*dist;
  fs[i]=dist*0.2*(0.85+rnd()*0.5);fd[i]=rnd()*0.25;fr[i]=rnd()*TAU;fw[i]=(rnd()<.5?-1:1)*(0.25+rnd()*0.55);fp[i]=Math.floor(rnd()*250);
}

/* ---------- State ---------- */
let running=true;
let t0=0,state=0; // 0 idle, 1 blooming, 2 full
let yaw=0,pitch=0,vel=0,drag=false,lx=0,ly=0,moved=0;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function trigger(){
  if(state===0){state=1;t0=performance.now();hint.style.opacity=0;go.classList.add('off');vel=2}
  else if(state===2){state=0;yaw=0;pitch=0;vel=0;ht.textContent='Kéo để xoay trái tim nha';go.classList.remove('off');hint.style.opacity=.85}
}
cv.addEventListener('pointerdown',e=>{drag=true;moved=0;lx=e.clientX;ly=e.clientY;vel=0;cv.style.cursor='grabbing';try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);yaw+=dx*0.008;pitch=clamp(pitch+dy*0.008,-1.2,1.2);vel=vel*.5+dx*0.008*30});
const endDrag=()=>{if(!drag)return;drag=false;cv.style.cursor='grab';};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',()=>{drag=false});
let leaving=false;
function switchScene(){
  running=false;
  cv.style.display='none';hint.style.display='none';go.style.display='none';
  for(const el of [document.documentElement,document.body]){el.style.background='#fff';el.style.overflow='auto';el.style.height='auto'}
  window.startRoseScene();
  const f=document.getElementById('fade');f.classList.remove('on');
  setTimeout(()=>{f.style.display='none'},1400);
}
function leave(){if(leaving)return;leaving=true;go.classList.add('off');hint.style.opacity=0;document.getElementById('fade').classList.add('on');setTimeout(switchScene,1300)}
go.addEventListener('click',()=>{if(state===0)trigger();else if(state===2)leave()});
addEventListener('keydown',e=>{if(state===2&&(e.key===' '||e.key==='Enter'))leave()});

function frame(now){if(!running)return;
  const t=now/1000,dtm=Math.min(.05,(now-(frame.l||now))/1000);frame.l=now;
  if(!drag){yaw+=vel*dtm;vel*=Math.pow(.05,dtm)}
  const a=yaw,ca=Math.cos(a),sa=Math.sin(a),cp=Math.cos(pitch),sp=Math.sin(pitch);
  let p=0;
  if(state>0){p=clamp((now-t0)/BLOOM_MS,0,1);if(p>=1&&state===1){state=2;ht.textContent='';hint.style.opacity=.85;go.classList.remove('off')}}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalCompositeOperation='source-over';ctx.globalAlpha=1;
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#02030f');bg.addColorStop(.6,'#080614');bg.addColorStop(1,'#140818');
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  if(p>0){const rg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);rg.addColorStop(0,'#f0679c');rg.addColorStop(1,'#a82a66');ctx.globalAlpha=clamp(p*1.5,0,1);ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}

  /* dust (rotates in sync) */
  ctx.globalCompositeOperation='lighter';
  const da=1-p;
  if(da>0)for(let i=0;i<ND;i++){
    const zr=-dx[i]*sa+dz[i]*ca;if(zr<80)continue;const xr=dx[i]*ca+dz[i]*sa,d=F/zr,s=dsz[i]*(0.6+d*.5);
    ctx.fillStyle='rgba('+dc[i]+','+(0.75*da).toFixed(2)+')';ctx.beginPath();ctx.arc(W/2+xr*d,H/2-dy[i]*d,s/2,0,TAU);ctx.fill();
  }

  /* heart */
  const ha=p>0?Math.max(0,1-p*1.7):1;
  if(ha>0){
    const pulse=1+0.035*Math.sin(t*2.6),s=U*pulse,gr=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,U*26*F/HZ);
    gr.addColorStop(0,'rgba(255,70,130,'+(0.28*ha)+')');gr.addColorStop(1,'rgba(255,70,130,0)');
    ctx.globalAlpha=1;ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=ha;
    for(let b=0;b<4;b++){
      ctx.fillStyle=COL[b];ctx.beginPath();
      for(let i=bStart[b];i<bStart[b+1];i++){
        const x=hx[i]*s,y0=hy[i]*s,z=hz[i]*s,xr=x*ca+z*sa,z1=-x*sa+z*ca,yr=y0*cp-z1*sp,zr=y0*sp+z1*cp,d=F/(HZ+zr);
        const r=(1.1+hs[i]*1.2)*(0.75+0.5*Math.sin(t*1.6+hp[i]))*d*0.2,cx=W/2+xr*d,cy=H/2-yr*d;
        ctx.moveTo(cx+r,cy);ctx.arc(cx,cy,r,0,TAU);
      }
      ctx.fill();
    }
    ctx.globalAlpha=1;
  }

  /* flowers burst out of the heart centre */
  if(p>0){
    ctx.globalCompositeOperation='source-over';
    const vis=[];
    for(let i=0;i<NF;i++){
      const lp=clamp((p-fd[i])/0.75,0,1);if(lp<=0)continue;
      const e=1-Math.pow(1-lp,3),px=fx[i]*e,py=fy[i]*e,pz=HZ+(fz[i]-HZ)*e;
      const zr=-px*sa+pz*ca;if(zr<150)continue;
      const xr=px*ca+pz*sa,d=F/zr,sz=fs[i]*Math.min(1,lp*2.6)*d,sx=W/2+xr*d,sy=H/2-py*d,h=sz*.55;
      if(sx+h<0||sx-h>W||sy+h<0||sy-h>H)continue;
      Z[i]=zr;SX[i]=sx;SY[i]=sy;SZ[i]=sz;vis.push(i);
    }
    vis.sort((m,n)=>Z[n]-Z[m]);
    for(const i of vis){
      const r=fr[i]+fw[i]*t,c=Math.cos(r)*DPR,s=Math.sin(r)*DPR,sz=SZ[i];
      ctx.setTransform(c,s,-s,c,SX[i]*DPR,SY[i]*DPR);ctx.drawImage(POOL[fp[i]%POOL.length],-sz/2,-sz/2,sz,sz);
    }
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
</script>
